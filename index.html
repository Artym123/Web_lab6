<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание 6 — Кjлькулятор услуги</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header class="bg-primary-subtle border-bottom py-3 mb-4">
        <div class="container">
            <h1 class="h4 mb-0">Калькулятор стоимости услуги</h1>
        </div>
    </header>

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card">
                    <div class="card-body">

                        <form id="calc-form" novalidate>

                            <div class="mb-3">
                                <label for="quantity" class="form-label">Количество:</label>
                                <input type="number" class="form-control" id="quantity"
                                       name="quantity" min="1" value="1">
                                <div id="error" class="text-danger mt-1" role="alert"></div>
                            </div>

                            <fieldset class="mb-3">
                                <legend class="form-label fs-6">Тип услуги:</legend>

                                <div class="form-check">
                                    <input class="form-check-input" type="radio"
                                           name="service" id="service-1" value="1" checked>
                                    <label class="form-check-label" for="service-1">
                                        Услуга «Базовая» — 1000 ₽
                                    </label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="radio"
                                           name="service" id="service-2" value="2">
                                    <label class="form-check-label" for="service-2">
                                        Услуга «С опциями» — 1500 ₽
                                    </label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="radio"
                                           name="service" id="service-3" value="3">
                                    <label class="form-check-label" for="service-3">
                                        Услуга «Со свойством» — 2000 ₽
                                    </label>
                                </div>
                            </fieldset>

                            <div class="mb-3" id="option-block" hidden>
                                <label for="option" class="form-label">Опция:</label>
                                <select class="form-select" id="option" name="option">
                                    <option value="0">Без опции (+0 ₽)</option>
                                    <option value="200">Стандарт (+200 ₽)</option>
                                    <option value="500">Премиум (+500 ₽)</option>
                                    <option value="1000">VIP (+1000 ₽)</option>
                                </select>
                            </div>

                            <div class="mb-3 form-check" id="property-block" hidden>
                                <input class="form-check-input" type="checkbox"
                                       id="property" name="property">
                                <label class="form-check-label" for="property">
                                    Дополнительное свойство (+300 ₽)
                                </label>
                            </div>

                        </form>

                        <div id="result" class="alert alert-success mt-4 mb-0 fs-5" aria-live="polite">
                            Стоимость: 1000 ₽
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-primary-subtle border-top py-3 mt-4">
        <div class="container text-center">
            Балакин Артем
        </div>
    </footer>

</body>

</html>
